version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.7.3-python3.10
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
  volumes:
    - ./dags:/opt/airflow/dags
    - ./spark_scripts:/opt/airflow/spark_scripts
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres_airflow:
      condition: service_healthy

services:
  # ==========================================
  # 1. STORAGE: MINIO (Bronze & Silver Layer)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: nettd_minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Web UI Port
    volumes:
      - minio_data:/data
    restart: unless-stopped

# ==========================================
  # 2. PROCESSING: SPARK 3.5 CLUSTER (Bitnami)
  # ==========================================
  spark-master:
    image: bitnami/spark:latest
    container_name: nettd_spark_master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Port giao tiếp nội bộ
    volumes:
      - ./spark_scripts:/opt/spark_scripts
    restart: unless-stopped

  spark-worker:
    image: bitnami/spark:latest 
    container_name: nettd_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G  
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - ./spark_scripts:/opt/spark_scripts
    restart: unless-stopped
  # ==========================================
  # 3. SERVING & MONITORING: TIMESCALEDB (Gold Layer)
  # ==========================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: nettd_timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=timescale_password
      - POSTGRES_DB=timescale_db
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ==========================================
  # 4. ORCHESTRATION: APACHE AIRFLOW
  # ==========================================
  postgres_airflow:
    image: postgres:13
    container_name: nettd_postgres_airflow
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: nettd_airflow_init
    command: version
    environment:
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    depends_on:
      postgres_airflow:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: nettd_airflow_webserver
    command: webserver
    ports:
      - "8082:8080" # Map ra port 8082 để không trùng với Spark Master
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: nettd_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  minio_data:
  timescale_data:
  postgres_airflow_data: