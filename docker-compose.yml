x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
  volumes:
    - ./dags:/opt/airflow/dags
    - ./spark_scripts:/opt/airflow/spark_scripts
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres_airflow:
      condition: service_healthy

services:
  # ==========================================
  # 1. STORAGE: MINIO (Bronze & Silver Layer)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: nettd_minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   
      - "9001:9001"   
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ==========================================
  # 3. SERVING & MONITORING: TIMESCALEDB (Gold Layer)
  # ==========================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: nettd_timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=timescale_password
      - POSTGRES_DB=timescale_db
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ==========================================
  # 4. ORCHESTRATION: APACHE AIRFLOW
  # ==========================================
  postgres_airflow:
    image: postgres:13
    container_name: nettd_postgres_airflow
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create --username admin --firstname Mai --lastname Duy --role Admin --email maithanhduy1705@gmail.com --password admin || true)
      "
    depends_on:
      postgres_airflow:  # ĐÃ FIX TÊN Ở ĐÂY
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  
  # ==========================================
  # 5. PROCESSING: SPARK CLUSTER
  # ==========================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: mdt_spark_master
    environment:
      - SPARK_SQL_EXTENSIONS=io.delta.sql.DeltaSparkSessionExtension
      - SPARK_SQL_CATALOG_SPARK_CATALOG=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - PYSPARK_PYTHON=/usr/local/bin/python
      - PYSPARK_DRIVER_PYTHON=/usr/local/bin/python
    command: spark-class org.apache.spark.deploy.master.Master -h 0.0.0.0
    ports:
      - "8081:8080" 
      - "7077:7077"
    volumes:
      - ./spark_scripts:/opt/spark_scripts

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: mdt_spark_worker_1
    environment:
      - SPARK_SQL_EXTENSIONS=io.delta.sql.DeltaSparkSessionExtension
      - SPARK_SQL_CATALOG_SPARK_CATALOG=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - PYSPARK_PYTHON=/usr/local/bin/python
      - PYSPARK_DRIVER_PYTHON=/usr/local/bin/python
    command: spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 -c 2 -m 2G
    ports:
      - "8082:8081" 
    volumes:
      - ./spark_scripts:/opt/spark_scripts
    depends_on:
      - spark-master

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: mdt_spark_worker_2
    environment:
      - SPARK_SQL_EXTENSIONS=io.delta.sql.DeltaSparkSessionExtension
      - SPARK_SQL_CATALOG_SPARK_CATALOG=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - PYSPARK_PYTHON=/usr/local/bin/python
      - PYSPARK_DRIVER_PYTHON=/usr/local/bin/python
    command: spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 -c 2 -m 2G
    ports:
      - "8083:8081" 
    volumes:
      - ./spark_scripts:/opt/spark_scripts
    depends_on:
      - spark-master

volumes:
  minio_data:
  timescale_data:
  postgres_airflow_data: